{% extends "base.html" %}
{% block title %}Order {{ order['id'] }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>Order status</h2>
  <dl class="kv">
    <dt>Order id</dt><dd id="order-id">{{ order['id'] }}</dd>
    <dt>Status</dt><dd id="order-status">{{ order['status'] }}</dd>
    <dt>Item</dt><dd>{{ order['sku'] }}</dd>
    <dt>Amount</dt><dd>${{ order['amount'] }}</dd>
    <dt>Coupon</dt><dd id="order-coupon">{{ order['coupon'] or 'none' }}</dd>
  </dl>
</section>
{% endblock %}
